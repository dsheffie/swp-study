<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff80022e40 lwc1 $f5, ($a1)",uops:[{"uuid":"34330","events":{"79496":"F","79501":"A","79502":"Q","79506":"S","79508":"H","79509":"C","79518":"R"}}]},{"str":"ffffffff80022e44 abs.s $f5, $f5",uops:[{"uuid":"34331","events":{"79496":"F","79502":"A","79513":"C","79519":"R"}}]},{"str":"ffffffff80022e48 c.lt.s $f0, $f5",uops:[{"uuid":"34332","events":{"79497":"F","79504":"A","79520":"C","79521":"R"}}]},{"str":"ffffffff80022e4c addu $a1, $s0, $a1",uops:[{"uuid":"34333","events":{"79497":"F","79504":"A","79507":"S","79508":"C","79521":"R"}}]},{"str":"ffffffff80022e50 bc1f 0x80022e60",uops:[{"uuid":"34334","events":{"79498":"F","79505":"A","79520":"S","79521":"C","79522":"R"}}]},{"str":"ffffffff80022e54 lwc1 $f6, ($a1)",uops:[{"uuid":"34335","events":{"79501":"F","79505":"A","79506":"Q","79507":"S","79509":"H","79510":"C","79522":"R"}}]},{"str":"ffffffff80022e60 abs.s $f5, $f6",uops:[{"uuid":"34336","events":{"79502":"F","79506":"A","79518":"C","79523":"R"}}]},{"str":"ffffffff80022e64 c.lt.s $f0, $f5",uops:[{"uuid":"34337","events":{"79502":"F","79510":"A","79526":"C","79527":"R"}}]},{"str":"ffffffff80022e68 nop ",uops:[{"uuid":"34338","events":{"79503":"F","79510":"A","79510":"C","79527":"R"}}]},{"str":"ffffffff80022e6c bc1f 0x80022e7c",uops:[{"uuid":"34339","events":{"79503":"F","79511":"A","79526":"S","79527":"C","79528":"R"}}]},{"str":"ffffffff80022e70 addiu $a0, $a0, 1",uops:[{"uuid":"34340","events":{"79504":"F","79511":"A","79515":"S","79516":"C","79528":"R"}}]},{"str":"ffffffff80022e7c addiu $a0, $a0, 1",uops:[{"uuid":"34341","events":{"79505":"F","79512":"A","79516":"S","79517":"C","79529":"R"}}]},{"str":"ffffffff80022e80 bne $a2, $a0, 0x80022e40",uops:[{"uuid":"34342","events":{"79506":"F","79512":"A","79517":"S","79518":"C","79529":"R"}}]},{"str":"ffffffff80022e84 addu $a1, $s0, $a1",uops:[{"uuid":"34343","events":{"79507":"F","79513":"A","79518":"S","79519":"C","79530":"R"}}]},{"str":"ffffffff80022e40 lwc1 $f5, ($a1)",uops:[{"uuid":"34344","events":{"79508":"F","79513":"A","79514":"Q","79518":"S","79520":"H","79521":"C","79530":"R"}}]},{"str":"ffffffff80022e44 abs.s $f5, $f5",uops:[{"uuid":"34345","events":{"79508":"F","79514":"A","79525":"C","79531":"R"}}]},{"str":"ffffffff80022e48 c.lt.s $f0, $f5",uops:[{"uuid":"34346","events":{"79509":"F","79516":"A","79532":"C","79533":"R"}}]},{"str":"ffffffff80022e4c addu $a1, $s0, $a1",uops:[{"uuid":"34347","events":{"79509":"F","79516":"A","79519":"S","79520":"C","79533":"R"}}]},{"str":"ffffffff80022e50 bc1f 0x80022e60",uops:[{"uuid":"34348","events":{"79510":"F","79517":"A","79532":"S","79533":"C","79534":"R"}}]},{"str":"ffffffff80022e54 lwc1 $f6, ($a1)",uops:[{"uuid":"34349","events":{"79513":"F","79517":"A","79518":"Q","79519":"S","79521":"H","79522":"C","79534":"R"}}]},{"str":"ffffffff80022e60 abs.s $f5, $f6",uops:[{"uuid":"34350","events":{"79514":"F","79518":"A","79530":"C","79535":"R"}}]},{"str":"ffffffff80022e64 c.lt.s $f0, $f5",uops:[{"uuid":"34351","events":{"79514":"F","79522":"A","79538":"C","79539":"R"}}]},{"str":"ffffffff80022e68 nop ",uops:[{"uuid":"34352","events":{"79515":"F","79522":"A","79522":"C","79539":"R"}}]},{"str":"ffffffff80022e6c bc1f 0x80022e7c",uops:[{"uuid":"34353","events":{"79515":"F","79523":"A","79538":"S","79539":"C","79540":"R"}}]},{"str":"ffffffff80022e70 addiu $a0, $a0, 1",uops:[{"uuid":"34354","events":{"79516":"F","79523":"A","79527":"S","79528":"C","79540":"R"}}]},{"str":"ffffffff80022e7c addiu $a0, $a0, 1",uops:[{"uuid":"34355","events":{"79517":"F","79524":"A","79528":"S","79529":"C","79541":"R"}}]},{"str":"ffffffff80022e80 bne $a2, $a0, 0x80022e40",uops:[{"uuid":"34356","events":{"79518":"F","79524":"A","79529":"S","79530":"C","79541":"R"}}]},{"str":"ffffffff80022e84 addu $a1, $s0, $a1",uops:[{"uuid":"34357","events":{"79519":"F","79525":"A","79530":"S","79531":"C","79542":"R"}}]},{"str":"ffffffff80022e40 lwc1 $f5, ($a1)",uops:[{"uuid":"34358","events":{"79520":"F","79525":"A","79526":"Q","79530":"S","79532":"H","79533":"C","79542":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
