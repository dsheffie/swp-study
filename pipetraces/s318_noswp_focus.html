<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff80022e40 lwc1 $f5, ($a1)",uops:[{"uuid":"41168","events":{"85424":"F","85426":"A","85427":"Q","85429":"S","85431":"H","85432":"C","85442":"R"}}]},{"str":"ffffffff80022e44 abs.s $f5, $f5",uops:[{"uuid":"41169","events":{"85424":"F","85427":"A","85436":"C","85443":"R"}}]},{"str":"ffffffff80022e48 c.lt.s $f0, $f5",uops:[{"uuid":"41170","events":{"85425":"F","85428":"A","85444":"C","85445":"R"}}]},{"str":"ffffffff80022e4c addu $a1, $s0, $a1",uops:[{"uuid":"41171","events":{"85425":"F","85428":"A","85431":"S","85432":"C","85445":"R"}}]},{"str":"ffffffff80022e50 bc1f 0x80022e60",uops:[{"uuid":"41172","events":{"85426":"F","85429":"A","85444":"S","85445":"C","85446":"R"}}]},{"str":"ffffffff80022e54 lwc1 $f6, ($a1)",uops:[{"uuid":"41173","events":{"85427":"F","85429":"A","85430":"Q","85431":"S","85433":"H","85434":"C","85446":"R"}}]},{"str":"ffffffff80022e60 abs.s $f5, $f6",uops:[{"uuid":"41174","events":{"85428":"F","85430":"A","85442":"C","85447":"R"}}]},{"str":"ffffffff80022e64 c.lt.s $f0, $f5",uops:[{"uuid":"41175","events":{"85428":"F","85434":"A","85450":"C","85451":"R"}}]},{"str":"ffffffff80022e68 nop ",uops:[{"uuid":"41176","events":{"85429":"F","85434":"A","85434":"C","85451":"R"}}]},{"str":"ffffffff80022e6c bc1f 0x80022e7c",uops:[{"uuid":"41177","events":{"85429":"F","85435":"A","85450":"S","85451":"C","85452":"R"}}]},{"str":"ffffffff80022e70 addiu $a0, $a0, 1",uops:[{"uuid":"41178","events":{"85430":"F","85435":"A","85439":"S","85440":"C","85452":"R"}}]},{"str":"ffffffff80022e7c addiu $a0, $a0, 1",uops:[{"uuid":"41179","events":{"85431":"F","85436":"A","85440":"S","85441":"C","85453":"R"}}]},{"str":"ffffffff80022e80 bne $a2, $a0, 0x80022e40",uops:[{"uuid":"41180","events":{"85432":"F","85436":"A","85441":"S","85442":"C","85453":"R"}}]},{"str":"ffffffff80022e84 addu $a1, $s0, $a1",uops:[{"uuid":"41181","events":{"85433":"F","85437":"A","85442":"S","85443":"C","85454":"R"}}]},{"str":"ffffffff80022e40 lwc1 $f5, ($a1)",uops:[{"uuid":"41182","events":{"85434":"F","85437":"A","85438":"Q","85442":"S","85444":"H","85445":"C","85454":"R"}}]},{"str":"ffffffff80022e44 abs.s $f5, $f5",uops:[{"uuid":"41183","events":{"85434":"F","85438":"A","85449":"C","85455":"R"}}]},{"str":"ffffffff80022e48 c.lt.s $f0, $f5",uops:[{"uuid":"41184","events":{"85435":"F","85440":"A","85456":"C","85457":"R"}}]},{"str":"ffffffff80022e4c addu $a1, $s0, $a1",uops:[{"uuid":"41185","events":{"85435":"F","85440":"A","85443":"S","85444":"C","85457":"R"}}]},{"str":"ffffffff80022e50 bc1f 0x80022e60",uops:[{"uuid":"41186","events":{"85436":"F","85441":"A","85456":"S","85457":"C","85458":"R"}}]},{"str":"ffffffff80022e54 lwc1 $f6, ($a1)",uops:[{"uuid":"41187","events":{"85437":"F","85441":"A","85442":"Q","85443":"S","85445":"H","85446":"C","85458":"R"}}]},{"str":"ffffffff80022e60 abs.s $f5, $f6",uops:[{"uuid":"41188","events":{"85438":"F","85442":"A","85454":"C","85459":"R"}}]},{"str":"ffffffff80022e64 c.lt.s $f0, $f5",uops:[{"uuid":"41189","events":{"85438":"F","85446":"A","85462":"C","85463":"R"}}]},{"str":"ffffffff80022e68 nop ",uops:[{"uuid":"41190","events":{"85439":"F","85446":"A","85446":"C","85463":"R"}}]},{"str":"ffffffff80022e6c bc1f 0x80022e7c",uops:[{"uuid":"41191","events":{"85439":"F","85447":"A","85462":"S","85463":"C","85464":"R"}}]},{"str":"ffffffff80022e70 addiu $a0, $a0, 1",uops:[{"uuid":"41192","events":{"85440":"F","85447":"A","85451":"S","85452":"C","85464":"R"}}]},{"str":"ffffffff80022e7c addiu $a0, $a0, 1",uops:[{"uuid":"41193","events":{"85441":"F","85448":"A","85452":"S","85453":"C","85465":"R"}}]},{"str":"ffffffff80022e80 bne $a2, $a0, 0x80022e40",uops:[{"uuid":"41194","events":{"85442":"F","85448":"A","85453":"S","85454":"C","85465":"R"}}]},{"str":"ffffffff80022e84 addu $a1, $s0, $a1",uops:[{"uuid":"41195","events":{"85443":"F","85449":"A","85454":"S","85455":"C","85466":"R"}}]},{"str":"ffffffff80022e40 lwc1 $f5, ($a1)",uops:[{"uuid":"41196","events":{"85444":"F","85449":"A","85450":"Q","85454":"S","85456":"H","85457":"C","85466":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
