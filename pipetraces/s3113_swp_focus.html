<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff8002dff0 abs.s $f5, $f6",uops:[{"uuid":"38771","events":{"87278":"F","87280":"A","87291":"C","87296":"R"}}]},{"str":"ffffffff8002dff4 c.lt.s $f0, $f5",uops:[{"uuid":"38772","events":{"87278":"F","87281":"A","87299":"C","87300":"R"}}]},{"str":"ffffffff8002dff8 nop ",uops:[{"uuid":"38773","events":{"87279":"F","87281":"A","87281":"C","87300":"R"}}]},{"str":"ffffffff8002dffc bc1f 0x8002e00c",uops:[{"uuid":"38774","events":{"87279":"F","87282":"A","87299":"S","87300":"C","87301":"R"}}]},{"str":"ffffffff8002e000 nop ",uops:[{"uuid":"38775","events":{"87280":"F","87282":"A","87282":"C","87301":"R"}}]},{"str":"ffffffff8002e00c beq $a0, $a1, 0x8002df4c",uops:[{"uuid":"38776","events":{"87281":"F","87283":"A","87287":"S","87288":"C","87302":"R"}}]},{"str":"ffffffff8002e010 nop ",uops:[{"uuid":"38777","events":{"87282":"F","87284":"A","87284":"C","87302":"R"}}]},{"str":"ffffffff8002e014 lwc1 $f5, -4($a0)",uops:[{"uuid":"38778","events":{"87282":"F","87284":"A","87285":"Q","87286":"S","87288":"H","87289":"C","87303":"R"}}]},{"str":"ffffffff8002e018 abs.s $f5, $f5",uops:[{"uuid":"38779","events":{"87283":"F","87285":"A","87297":"C","87303":"R"}}]},{"str":"ffffffff8002e01c c.lt.s $f0, $f5",uops:[{"uuid":"38780","events":{"87283":"F","87288":"A","87305":"C","87306":"R"}}]},{"str":"ffffffff8002e020 lwc1 $f6, ($a0)",uops:[{"uuid":"38781","events":{"87284":"F","87288":"A","87289":"Q","87290":"S","87292":"H","87293":"C","87306":"R"}}]},{"str":"ffffffff8002e024 bc1f 0x8002dff0",uops:[{"uuid":"38782","events":{"87284":"F","87289":"A","87305":"S","87306":"C","87307":"R"}}]},{"str":"ffffffff8002e028 addiu $a0, $a0, 8",uops:[{"uuid":"38783","events":{"87285":"F","87289":"A","87294":"S","87295":"C","87307":"R"}}]},{"str":"ffffffff8002dff0 abs.s $f5, $f6",uops:[{"uuid":"38784","events":{"87286":"F","87290":"A","87303":"C","87308":"R"}}]},{"str":"ffffffff8002dff4 c.lt.s $f0, $f5",uops:[{"uuid":"38785","events":{"87286":"F","87295":"A","87311":"C","87312":"R"}}]},{"str":"ffffffff8002dff8 nop ",uops:[{"uuid":"38786","events":{"87287":"F","87295":"A","87295":"C","87312":"R"}}]},{"str":"ffffffff8002dffc bc1f 0x8002e00c",uops:[{"uuid":"38787","events":{"87287":"F","87296":"A","87311":"S","87312":"C","87313":"R"}}]},{"str":"ffffffff8002e000 nop ",uops:[{"uuid":"38788","events":{"87288":"F","87296":"A","87296":"C","87313":"R"}}]},{"str":"ffffffff8002e00c beq $a0, $a1, 0x8002df4c",uops:[{"uuid":"38789","events":{"87289":"F","87297":"A","87300":"S","87301":"C","87314":"R"}}]},{"str":"ffffffff8002e010 nop ",uops:[{"uuid":"38790","events":{"87290":"F","87297":"A","87297":"C","87314":"R"}}]},{"str":"ffffffff8002e014 lwc1 $f5, -4($a0)",uops:[{"uuid":"38791","events":{"87290":"F","87298":"A","87299":"Q","87300":"S","87302":"H","87303":"C","87315":"R"}}]},{"str":"ffffffff8002e018 abs.s $f5, $f5",uops:[{"uuid":"38792","events":{"87291":"F","87299":"A","87309":"C","87315":"R"}}]},{"str":"ffffffff8002e01c c.lt.s $f0, $f5",uops:[{"uuid":"38793","events":{"87291":"F","87301":"A","87317":"C","87318":"R"}}]},{"str":"ffffffff8002e020 lwc1 $f6, ($a0)",uops:[{"uuid":"38794","events":{"87292":"F","87301":"A","87302":"Q","87303":"S","87305":"H","87306":"C","87318":"R"}}]},{"str":"ffffffff8002e024 bc1f 0x8002dff0",uops:[{"uuid":"38795","events":{"87292":"F","87302":"A","87317":"S","87318":"C","87319":"R"}}]},{"str":"ffffffff8002e028 addiu $a0, $a0, 8",uops:[{"uuid":"38796","events":{"87293":"F","87302":"A","87306":"S","87307":"C","87319":"R"}}]},{"str":"ffffffff8002dff0 abs.s $f5, $f6",uops:[{"uuid":"38797","events":{"87298":"F","87303":"A","87315":"C","87320":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
