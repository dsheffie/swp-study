<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff80029068 addiu $a0, $a0, 4",uops:[{"uuid":"76362","events":{"104491":"F","104493":"A","104496":"S","104497":"C","104510":"R"}}]},{"str":"ffffffff8002906c beq $a0, $a3, 0x80028ffc",uops:[{"uuid":"76363","events":{"104491":"F","104494":"A","104497":"S","104498":"C","104511":"R"}}]},{"str":"ffffffff80029070 addiu $a1, $a1, 4",uops:[{"uuid":"76364","events":{"104492":"F","104494":"A","104498":"S","104499":"C","104511":"R"}}]},{"str":"ffffffff80029074 lwc1 $f5, -4($a0)",uops:[{"uuid":"76365","events":{"104492":"F","104495":"A","104496":"Q","104497":"S","104499":"H","104500":"C","104512":"R"}}]},{"str":"ffffffff80029078 lwc1 $f0, -4($a2)",uops:[{"uuid":"76366","events":{"104493":"F","104496":"A","104497":"Q","104498":"S","104500":"H","104501":"C","104512":"R"}}]},{"str":"ffffffff8002907c c.lt.s $f0, $f5",uops:[{"uuid":"76367","events":{"104493":"F","104497":"A","104509":"C","104513":"R"}}]},{"str":"ffffffff80029080 nop ",uops:[{"uuid":"76368","events":{"104494":"F","104497":"A","104497":"C","104513":"R"}}]},{"str":"ffffffff80029084 bc1f 0x80029068",uops:[{"uuid":"76369","events":{"104494":"F","104498":"A","104509":"S","104510":"C","104514":"R"}}]},{"str":"ffffffff80029088 addiu $a2, $a2, 4",uops:[{"uuid":"76370","events":{"104495":"F","104498":"A","104502":"S","104503":"C","104514":"R"}}]},{"str":"ffffffff8002908c lwc1 $f1, -4($a1)",uops:[{"uuid":"76371","events":{"104495":"F","104499":"A","104500":"Q","104501":"S","104503":"H","104504":"C","104515":"R"}}]},{"str":"ffffffff80029090 mul.s $f1, $f1, $f0",uops:[{"uuid":"76372","events":{"104496":"F","104500":"A","104511":"C","104515":"R"}}]},{"str":"ffffffff80029094 add.s $f1, $f5, $f1",uops:[{"uuid":"76373","events":{"104496":"F","104501":"A","104517":"C","104518":"R"}}]},{"str":"ffffffff80029098 b 0x80029068",uops:[{"uuid":"76374","events":{"104497":"F","104501":"A","104504":"S","104505":"C","104518":"R"}}]},{"str":"ffffffff8002909c swc1 $f1, -4($a0)",uops:[{"uuid":"76375","events":{"104498":"F","104502":"A","104503":"Q","104504":"S","104518":"Z","104507":"C","104519":"R"}}]},{"str":"ffffffff80029068 addiu $a0, $a0, 4",uops:[{"uuid":"76376","events":{"104499":"F","104502":"A","104505":"S","104506":"C","104519":"R"}}]},{"str":"ffffffff8002906c beq $a0, $a3, 0x80028ffc",uops:[{"uuid":"76377","events":{"104499":"F","104503":"A","104506":"S","104507":"C","104520":"R"}}]},{"str":"ffffffff80029070 addiu $a1, $a1, 4",uops:[{"uuid":"76378","events":{"104500":"F","104503":"A","104507":"S","104508":"C","104520":"R"}}]},{"str":"ffffffff80029074 lwc1 $f5, -4($a0)",uops:[{"uuid":"76379","events":{"104500":"F","104504":"A","104505":"Q","104506":"S","104508":"H","104509":"C","104521":"R"}}]},{"str":"ffffffff80029078 lwc1 $f0, -4($a2)",uops:[{"uuid":"76380","events":{"104501":"F","104505":"A","104506":"Q","104507":"S","104509":"H","104510":"C","104521":"R"}}]},{"str":"ffffffff8002907c c.lt.s $f0, $f5",uops:[{"uuid":"76381","events":{"104501":"F","104506":"A","104518":"C","104522":"R"}}]},{"str":"ffffffff80029080 nop ",uops:[{"uuid":"76382","events":{"104502":"F","104506":"A","104506":"C","104522":"R"}}]},{"str":"ffffffff80029084 bc1f 0x80029068",uops:[{"uuid":"76383","events":{"104502":"F","104507":"A","104518":"S","104519":"C","104523":"R"}}]},{"str":"ffffffff80029088 addiu $a2, $a2, 4",uops:[{"uuid":"76384","events":{"104503":"F","104507":"A","104511":"S","104512":"C","104523":"R"}}]},{"str":"ffffffff8002908c lwc1 $f1, -4($a1)",uops:[{"uuid":"76385","events":{"104503":"F","104508":"A","104509":"Q","104510":"S","104512":"H","104513":"C","104524":"R"}}]},{"str":"ffffffff80029090 mul.s $f1, $f1, $f0",uops:[{"uuid":"76386","events":{"104504":"F","104509":"A","104520":"C","104524":"R"}}]},{"str":"ffffffff80029094 add.s $f1, $f5, $f1",uops:[{"uuid":"76387","events":{"104504":"F","104510":"A","104526":"C","104527":"R"}}]},{"str":"ffffffff80029098 b 0x80029068",uops:[{"uuid":"76388","events":{"104505":"F","104510":"A","104513":"S","104514":"C","104527":"R"}}]},{"str":"ffffffff8002909c swc1 $f1, -4($a0)",uops:[{"uuid":"76389","events":{"104506":"F","104511":"A","104512":"Q","104513":"S","104527":"Z","104516":"C","104528":"R"}}]},{"str":"ffffffff80029068 addiu $a0, $a0, 4",uops:[{"uuid":"76390","events":{"104507":"F","104511":"A","104514":"S","104515":"C","104528":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
