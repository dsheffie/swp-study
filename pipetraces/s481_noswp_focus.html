<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff80029448 lwc1 $f0, -4($a1)",uops:[{"uuid":"84039","events":{"113522":"F","113525":"A","113527":"Q","113528":"S","113530":"H","113531":"C","113541":"R"}}]},{"str":"ffffffff8002944c c.lt.s $f0, $f30",uops:[{"uuid":"84040","events":{"113522":"F","113526":"A","113539":"C","113542":"R"}}]},{"str":"ffffffff80029450 nop ",uops:[{"uuid":"84041","events":{"113523":"F","113526":"A","113526":"C","113542":"R"}}]},{"str":"ffffffff80029454 bc1t 0x80029598",uops:[{"uuid":"84042","events":{"113523":"F","113527":"A","113539":"S","113540":"C","113543":"R"}}]},{"str":"ffffffff80029458 addiu $a1, $a1, 4",uops:[{"uuid":"84043","events":{"113524":"F","113527":"A","113531":"S","113532":"C","113543":"R"}}]},{"str":"ffffffff8002945c lwc1 $f3, -4($t0)",uops:[{"uuid":"84044","events":{"113524":"F","113528":"A","113529":"Q","113530":"S","113532":"H","113533":"C","113544":"R"}}]},{"str":"ffffffff80029460 lwc1 $f2, -4($a2)",uops:[{"uuid":"84045","events":{"113525":"F","113529":"A","113530":"Q","113531":"S","113533":"H","113534":"C","113544":"R"}}]},{"str":"ffffffff80029464 mul.s $f2, $f2, $f3",uops:[{"uuid":"84046","events":{"113525":"F","113530":"A","113541":"C","113545":"R"}}]},{"str":"ffffffff80029468 lwc1 $f1, -4($a3)",uops:[{"uuid":"84047","events":{"113526":"F","113531":"A","113532":"Q","113533":"S","113535":"H","113536":"C","113545":"R"}}]},{"str":"ffffffff8002946c addiu $a3, $a3, 4",uops:[{"uuid":"84048","events":{"113526":"F","113531":"A","113534":"S","113535":"C","113546":"R"}}]},{"str":"ffffffff80029470 add.s $f1, $f1, $f2",uops:[{"uuid":"84049","events":{"113527":"F","113532":"A","113547":"C","113548":"R"}}]},{"str":"ffffffff80029474 addiu $a2, $a2, 4",uops:[{"uuid":"84050","events":{"113527":"F","113532":"A","113535":"S","113536":"C","113548":"R"}}]},{"str":"ffffffff80029478 addiu $t0, $t0, 4",uops:[{"uuid":"84051","events":{"113528":"F","113533":"A","113536":"S","113537":"C","113549":"R"}}]},{"str":"ffffffff8002947c bne $a1, $t1, 0x80029448",uops:[{"uuid":"84052","events":{"113528":"F","113533":"A","113537":"S","113538":"C","113549":"R"}}]},{"str":"ffffffff80029480 swc1 $f1, -8($a3)",uops:[{"uuid":"84053","events":{"113529":"F","113534":"A","113535":"Q","113536":"S","113548":"Z","113539":"C","113550":"R"}}]},{"str":"ffffffff80029448 lwc1 $f0, -4($a1)",uops:[{"uuid":"84054","events":{"113530":"F","113534":"A","113536":"Q","113537":"S","113539":"H","113540":"C","113550":"R"}}]},{"str":"ffffffff8002944c c.lt.s $f0, $f30",uops:[{"uuid":"84055","events":{"113530":"F","113535":"A","113548":"C","113551":"R"}}]},{"str":"ffffffff80029450 nop ",uops:[{"uuid":"84056","events":{"113531":"F","113535":"A","113535":"C","113551":"R"}}]},{"str":"ffffffff80029454 bc1t 0x80029598",uops:[{"uuid":"84057","events":{"113531":"F","113536":"A","113548":"S","113549":"C","113552":"R"}}]},{"str":"ffffffff80029458 addiu $a1, $a1, 4",uops:[{"uuid":"84058","events":{"113532":"F","113536":"A","113540":"S","113541":"C","113552":"R"}}]},{"str":"ffffffff8002945c lwc1 $f3, -4($t0)",uops:[{"uuid":"84059","events":{"113533":"F","113537":"A","113538":"Q","113539":"S","113541":"H","113542":"C","113553":"R"}}]},{"str":"ffffffff80029460 lwc1 $f2, -4($a2)",uops:[{"uuid":"84060","events":{"113534":"F","113538":"A","113539":"Q","113540":"S","113542":"H","113543":"C","113553":"R"}}]},{"str":"ffffffff80029464 mul.s $f2, $f2, $f3",uops:[{"uuid":"84061","events":{"113534":"F","113539":"A","113550":"C","113554":"R"}}]},{"str":"ffffffff80029468 lwc1 $f1, -4($a3)",uops:[{"uuid":"84062","events":{"113535":"F","113540":"A","113541":"Q","113542":"S","113544":"H","113545":"C","113554":"R"}}]},{"str":"ffffffff8002946c addiu $a3, $a3, 4",uops:[{"uuid":"84063","events":{"113535":"F","113540":"A","113543":"S","113544":"C","113555":"R"}}]},{"str":"ffffffff80029470 add.s $f1, $f1, $f2",uops:[{"uuid":"84064","events":{"113536":"F","113541":"A","113556":"C","113557":"R"}}]},{"str":"ffffffff80029474 addiu $a2, $a2, 4",uops:[{"uuid":"84065","events":{"113536":"F","113541":"A","113544":"S","113545":"C","113557":"R"}}]},{"str":"ffffffff80029478 addiu $t0, $t0, 4",uops:[{"uuid":"84066","events":{"113537":"F","113542":"A","113545":"S","113546":"C","113558":"R"}}]},{"str":"ffffffff8002947c bne $a1, $t1, 0x80029448",uops:[{"uuid":"84067","events":{"113537":"F","113542":"A","113546":"S","113547":"C","113558":"R"}}]},{"str":"ffffffff80029480 swc1 $f1, -8($a3)",uops:[{"uuid":"84068","events":{"113538":"F","113543":"A","113544":"Q","113545":"S","113557":"Z","113548":"C","113559":"R"}}]},{"str":"ffffffff80029448 lwc1 $f0, -4($a1)",uops:[{"uuid":"84069","events":{"113539":"F","113543":"A","113545":"Q","113546":"S","113548":"H","113549":"C","113559":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
