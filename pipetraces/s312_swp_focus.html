<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff8002bd70 addiu $v0, $v0, 0x10",uops:[{"uuid":"19625","events":{"62992":"F","62997":"A","63000":"S","63001":"C","63009":"R"}}]},{"str":"ffffffff8002bd74 lwc1 $f1, -0xc($v0)",uops:[{"uuid":"19626","events":{"62992":"F","62998":"A","62999":"Q","63000":"S","63002":"H","63003":"C","63010":"R"}}]},{"str":"ffffffff8002bd78 mul.s $f4, $f3, $f4",uops:[{"uuid":"19627","events":{"62993":"F","62999":"A","63008":"C","63010":"R"}}]},{"str":"ffffffff8002bd7c lwc1 $f3, ($v0)",uops:[{"uuid":"19628","events":{"62993":"F","63000":"A","63001":"Q","63002":"S","63004":"H","63005":"C","63011":"R"}}]},{"str":"ffffffff8002bd80 beq $v0, $at, 0x8002be30",uops:[{"uuid":"19629","events":{"62994":"F","63000":"A","63003":"S","63004":"C","63011":"R"}}]},{"str":"ffffffff8002bd84 mul.s $f2, $f1, $f2",uops:[{"uuid":"19630","events":{"62994":"F","63001":"A","63010":"C","63012":"R"}}]},{"str":"ffffffff8002bd88 lwc1 $f1, -4($v0)",uops:[{"uuid":"19631","events":{"62995":"F","63002":"A","63003":"Q","63004":"S","63006":"H","63007":"C","63012":"R"}}]},{"str":"ffffffff8002bd8c mul.s $f0, $f3, $f0",uops:[{"uuid":"19632","events":{"62996":"F","63003":"A","63012":"C","63013":"R"}}]},{"str":"ffffffff8002bd90 lwc1 $f3, 8($v0)",uops:[{"uuid":"19633","events":{"62997":"F","63004":"A","63005":"Q","63006":"S","63008":"H","63009":"C","63013":"R"}}]},{"str":"ffffffff8002bd94 bne $v0, $v1, 0x8002bd70",uops:[{"uuid":"19634","events":{"62998":"F","63004":"A","63007":"S","63008":"C","63014":"R"}}]},{"str":"ffffffff8002bd98 mul.s $f5, $f1, $f5",uops:[{"uuid":"19635","events":{"62999":"F","63005":"A","63014":"C","63015":"R"}}]},{"str":"ffffffff8002bd70 addiu $v0, $v0, 0x10",uops:[{"uuid":"19636","events":{"63000":"F","63005":"A","63008":"S","63009":"C","63015":"R"}}]},{"str":"ffffffff8002bd74 lwc1 $f1, -0xc($v0)",uops:[{"uuid":"19637","events":{"63000":"F","63006":"A","63007":"Q","63008":"S","63010":"H","63011":"C","63016":"R"}}]},{"str":"ffffffff8002bd78 mul.s $f4, $f3, $f4",uops:[{"uuid":"19638","events":{"63001":"F","63007":"A","63016":"C","63017":"R"}}]},{"str":"ffffffff8002bd7c lwc1 $f3, ($v0)",uops:[{"uuid":"19639","events":{"63001":"F","63008":"A","63009":"Q","63010":"S","63012":"H","63013":"C","63017":"R"}}]},{"str":"ffffffff8002bd80 beq $v0, $at, 0x8002be30",uops:[{"uuid":"19640","events":{"63002":"F","63008":"A","63011":"S","63012":"C","63018":"R"}}]},{"str":"ffffffff8002bd84 mul.s $f2, $f1, $f2",uops:[{"uuid":"19641","events":{"63002":"F","63009":"A","63018":"C","63019":"R"}}]},{"str":"ffffffff8002bd88 lwc1 $f1, -4($v0)",uops:[{"uuid":"19642","events":{"63003":"F","63010":"A","63011":"Q","63012":"S","63014":"H","63015":"C","63019":"R"}}]},{"str":"ffffffff8002bd8c mul.s $f0, $f3, $f0",uops:[{"uuid":"19643","events":{"63004":"F","63011":"A","63020":"C","63021":"R"}}]},{"str":"ffffffff8002bd90 lwc1 $f3, 8($v0)",uops:[{"uuid":"19644","events":{"63005":"F","63012":"A","63013":"Q","63014":"S","63016":"H","63017":"C","63021":"R"}}]},{"str":"ffffffff8002bd94 bne $v0, $v1, 0x8002bd70",uops:[{"uuid":"19645","events":{"63006":"F","63012":"A","63015":"S","63016":"C","63022":"R"}}]},{"str":"ffffffff8002bd98 mul.s $f5, $f1, $f5",uops:[{"uuid":"19646","events":{"63007":"F","63013":"A","63022":"C","63023":"R"}}]},{"str":"ffffffff8002bd70 addiu $v0, $v0, 0x10",uops:[{"uuid":"19647","events":{"63008":"F","63013":"A","63016":"S","63017":"C","63023":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
