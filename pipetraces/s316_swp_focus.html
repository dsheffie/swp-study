<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff8002cab8 lwc1 $f5, ($a0)",uops:[{"uuid":"45571","events":{"129395":"F","129399":"A","129401":"Q","129402":"S","129404":"H","129405":"C","129406":"R"}}]},{"str":"ffffffff8002cabc c.lt.s $f5, $f0",uops:[{"uuid":"45572","events":{"129395":"F","129400":"A","129412":"C","129413":"R"}}]},{"str":"ffffffff8002cac0 nop ",uops:[{"uuid":"45573","events":{"129396":"F","129400":"A","129400":"C","129413":"R"}}]},{"str":"ffffffff8002cac4 bc1f 0x8002cad4",uops:[{"uuid":"45574","events":{"129396":"F","129401":"A","129412":"S","129413":"C","129414":"R"}}]},{"str":"ffffffff8002cac8 addiu $a0, $a0, 8",uops:[{"uuid":"45575","events":{"129397":"F","129401":"A","129405":"S","129406":"C","129414":"R"}}]},{"str":"ffffffff8002cacc mov.s $f0, $f5",uops:[{"uuid":"45576","events":{"129398":"F","129402":"A","129410":"C","129415":"R"}}]},{"str":"ffffffff8002cad0 swc1 $f5, 0x20($sp)",uops:[{"uuid":"45577","events":{"129399":"F","129402":"A","129403":"Q","129404":"S","129407":"Z","129407":"C","129415":"R"}}]},{"str":"ffffffff8002cad4 beq $a0, $a1, 0x8002ca1c",uops:[{"uuid":"45578","events":{"129399":"F","129403":"A","129406":"S","129407":"C","129416":"R"}}]},{"str":"ffffffff8002cad8 nop ",uops:[{"uuid":"45579","events":{"129400":"F","129403":"A","129403":"C","129416":"R"}}]},{"str":"ffffffff8002cadc lwc1 $f5, -4($a0)",uops:[{"uuid":"45580","events":{"129400":"F","129404":"A","129405":"Q","129406":"S","129408":"H","129409":"C","129417":"R"}}]},{"str":"ffffffff8002cae0 c.lt.s $f5, $f0",uops:[{"uuid":"45581","events":{"129401":"F","129405":"A","129418":"C","129419":"R"}}]},{"str":"ffffffff8002cae4 nop ",uops:[{"uuid":"45582","events":{"129401":"F","129405":"A","129405":"C","129419":"R"}}]},{"str":"ffffffff8002cae8 bc1fl 0x8002cabc",uops:[{"uuid":"45583","events":{"129402":"F","129406":"A","129418":"S","129419":"C","129420":"R"}}]},{"str":"ffffffff8002caf0 mov.s $f0, $f5",uops:[{"uuid":"45584","events":{"129423":"F","129428":"A","129432":"C","129433":"R"}}]},{"str":"ffffffff8002caf4 b 0x8002cab8",uops:[{"uuid":"45585","events":{"129423":"F","129428":"A","129431":"S","129432":"C","129433":"R"}}]},{"str":"ffffffff8002caf8 swc1 $f5, 0x20($sp)",uops:[{"uuid":"45586","events":{"129424":"F","129429":"A","129430":"Q","129431":"S","129432":"Z","129434":"C","129435":"R"}}]},{"str":"ffffffff8002cab8 lwc1 $f5, ($a0)",uops:[{"uuid":"45587","events":{"129425":"F","129429":"A","129431":"Q","129432":"S","129434":"H","129435":"C","129436":"R"}}]},{"str":"ffffffff8002cabc c.lt.s $f5, $f0",uops:[{"uuid":"45588","events":{"129425":"F","129430":"A","129442":"C","129443":"R"}}]},{"str":"ffffffff8002cac0 nop ",uops:[{"uuid":"45589","events":{"129426":"F","129430":"A","129430":"C","129443":"R"}}]},{"str":"ffffffff8002cac4 bc1f 0x8002cad4",uops:[{"uuid":"45590","events":{"129426":"F","129431":"A","129442":"S","129443":"C","129444":"R"}}]},{"str":"ffffffff8002cac8 addiu $a0, $a0, 8",uops:[{"uuid":"45591","events":{"129427":"F","129431":"A","129435":"S","129436":"C","129444":"R"}}]},{"str":"ffffffff8002cacc mov.s $f0, $f5",uops:[{"uuid":"45592","events":{"129428":"F","129432":"A","129440":"C","129445":"R"}}]},{"str":"ffffffff8002cad0 swc1 $f5, 0x20($sp)",uops:[{"uuid":"45593","events":{"129429":"F","129432":"A","129433":"Q","129434":"S","129437":"Z","129437":"C","129445":"R"}}]},{"str":"ffffffff8002cad4 beq $a0, $a1, 0x8002ca1c",uops:[{"uuid":"45594","events":{"129429":"F","129433":"A","129436":"S","129437":"C","129446":"R"}}]},{"str":"ffffffff8002cad8 nop ",uops:[{"uuid":"45595","events":{"129430":"F","129433":"A","129433":"C","129446":"R"}}]},{"str":"ffffffff8002cadc lwc1 $f5, -4($a0)",uops:[{"uuid":"45596","events":{"129430":"F","129434":"A","129435":"Q","129436":"S","129438":"H","129439":"C","129447":"R"}}]},{"str":"ffffffff8002cae0 c.lt.s $f5, $f0",uops:[{"uuid":"45597","events":{"129431":"F","129435":"A","129448":"C","129449":"R"}}]},{"str":"ffffffff8002cae4 nop ",uops:[{"uuid":"45598","events":{"129431":"F","129435":"A","129435":"C","129449":"R"}}]},{"str":"ffffffff8002cae8 bc1fl 0x8002cabc",uops:[{"uuid":"45599","events":{"129432":"F","129436":"A","129448":"S","129449":"C","129450":"R"}}]},{"str":"ffffffff8002caf0 mov.s $f0, $f5",uops:[{"uuid":"45600","events":{"129453":"F","129458":"A","129462":"C","129463":"R"}}]},{"str":"ffffffff8002caf4 b 0x8002cab8",uops:[{"uuid":"45601","events":{"129453":"F","129458":"A","129461":"S","129462":"C","129463":"R"}}]},{"str":"ffffffff8002caf8 swc1 $f5, 0x20($sp)",uops:[{"uuid":"45602","events":{"129454":"F","129459":"A","129460":"Q","129461":"S","129462":"Z","129464":"C","129465":"R"}}]},{"str":"ffffffff8002cab8 lwc1 $f5, ($a0)",uops:[{"uuid":"45603","events":{"129455":"F","129459":"A","129461":"Q","129462":"S","129464":"H","129465":"C","129466":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
