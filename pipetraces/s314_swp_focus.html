<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff8002c4b0 c.lt.s $f0, $f5",uops:[{"uuid":"33038","events":{"84830":"F","84832":"A","84849":"C","84850":"R"}}]},{"str":"ffffffff8002c4b4 nop ",uops:[{"uuid":"33039","events":{"84830":"F","84832":"A","84832":"C","84850":"R"}}]},{"str":"ffffffff8002c4b8 bc1f 0x8002c4c8",uops:[{"uuid":"33040","events":{"84831":"F","84833":"A","84849":"S","84850":"C","84851":"R"}}]},{"str":"ffffffff8002c4bc addiu $a0, $a0, 8",uops:[{"uuid":"33041","events":{"84832":"F","84834":"A","84838":"S","84839":"C","84851":"R"}}]},{"str":"ffffffff8002c4c8 beq $a0, $a1, 0x8002c410",uops:[{"uuid":"33042","events":{"84833":"F","84835":"A","84839":"S","84840":"C","84852":"R"}}]},{"str":"ffffffff8002c4cc nop ",uops:[{"uuid":"33043","events":{"84833":"F","84835":"A","84835":"C","84852":"R"}}]},{"str":"ffffffff8002c4d0 lwc1 $f5, -4($a0)",uops:[{"uuid":"33044","events":{"84834":"F","84836":"A","84837":"Q","84838":"S","84840":"H","84841":"C","84853":"R"}}]},{"str":"ffffffff8002c4d4 c.lt.s $f0, $f5",uops:[{"uuid":"33045","events":{"84834":"F","84837":"A","84855":"C","84856":"R"}}]},{"str":"ffffffff8002c4d8 nop ",uops:[{"uuid":"33046","events":{"84835":"F","84837":"A","84837":"C","84856":"R"}}]},{"str":"ffffffff8002c4dc bc1fl 0x8002c4b0",uops:[{"uuid":"33047","events":{"84835":"F","84838":"A","84855":"S","84856":"C","84857":"R"}}]},{"str":"ffffffff8002c4e0 lwc1 $f5, ($a0)",uops:[{"uuid":"33048","events":{"84836":"F","84838":"A","84839":"Q","84840":"S","84842":"H","84843":"C","84857":"R"}}]},{"str":"ffffffff8002c4b0 c.lt.s $f0, $f5",uops:[{"uuid":"33049","events":{"84837":"F","84845":"A","84861":"C","84862":"R"}}]},{"str":"ffffffff8002c4b4 nop ",uops:[{"uuid":"33050","events":{"84837":"F","84845":"A","84845":"C","84862":"R"}}]},{"str":"ffffffff8002c4b8 bc1f 0x8002c4c8",uops:[{"uuid":"33051","events":{"84838":"F","84846":"A","84861":"S","84862":"C","84863":"R"}}]},{"str":"ffffffff8002c4bc addiu $a0, $a0, 8",uops:[{"uuid":"33052","events":{"84839":"F","84846":"A","84850":"S","84851":"C","84863":"R"}}]},{"str":"ffffffff8002c4c8 beq $a0, $a1, 0x8002c410",uops:[{"uuid":"33053","events":{"84840":"F","84847":"A","84851":"S","84852":"C","84864":"R"}}]},{"str":"ffffffff8002c4cc nop ",uops:[{"uuid":"33054","events":{"84840":"F","84847":"A","84847":"C","84864":"R"}}]},{"str":"ffffffff8002c4d0 lwc1 $f5, -4($a0)",uops:[{"uuid":"33055","events":{"84841":"F","84848":"A","84849":"Q","84850":"S","84852":"H","84853":"C","84865":"R"}}]},{"str":"ffffffff8002c4d4 c.lt.s $f0, $f5",uops:[{"uuid":"33056","events":{"84841":"F","84851":"A","84867":"C","84868":"R"}}]},{"str":"ffffffff8002c4d8 nop ",uops:[{"uuid":"33057","events":{"84842":"F","84851":"A","84851":"C","84868":"R"}}]},{"str":"ffffffff8002c4dc bc1fl 0x8002c4b0",uops:[{"uuid":"33058","events":{"84842":"F","84852":"A","84867":"S","84868":"C","84869":"R"}}]},{"str":"ffffffff8002c4e0 lwc1 $f5, ($a0)",uops:[{"uuid":"33059","events":{"84843":"F","84852":"A","84853":"Q","84854":"S","84856":"H","84857":"C","84869":"R"}}]},{"str":"ffffffff8002c4b0 c.lt.s $f0, $f5",uops:[{"uuid":"33060","events":{"84844":"F","84857":"A","84873":"C","84874":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
