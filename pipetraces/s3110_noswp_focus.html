<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff800234ac lwc1 $f5, -4($a1)",uops:[{"uuid":"105104","events":{"414835":"F","414837":"A","414838":"Q","414841":"S","414843":"H","414844":"C","414856":"R"}}]},{"str":"ffffffff800234b0 c.lt.s $f0, $f5",uops:[{"uuid":"105105","events":{"414836":"F","414838":"A","414858":"C","414859":"R"}}]},{"str":"ffffffff800234b4 nop ",uops:[{"uuid":"105106","events":{"414836":"F","414838":"A","414838":"C","414859":"R"}}]},{"str":"ffffffff800234b8 bc1fl 0x800234d0",uops:[{"uuid":"105107","events":{"414837":"F","414839":"A","414858":"S","414859":"C","414860":"R"}}]},{"str":"ffffffff800234bc lwc1 $f5, ($a1)",uops:[{"uuid":"105108","events":{"414838":"F","414840":"A","414841":"Q","414842":"S","414844":"H","414845":"C","414860":"R"}}]},{"str":"ffffffff800234d0 c.lt.s $f0, $f5",uops:[{"uuid":"105109","events":{"414839":"F","414848":"A","414864":"C","414865":"R"}}]},{"str":"ffffffff800234d4 nop ",uops:[{"uuid":"105110","events":{"414839":"F","414848":"A","414848":"C","414865":"R"}}]},{"str":"ffffffff800234d8 bc1f 0x800234ec",uops:[{"uuid":"105111","events":{"414840":"F","414849":"A","414864":"S","414865":"C","414866":"R"}}]},{"str":"ffffffff800234dc addiu $a0, $a0, 1",uops:[{"uuid":"105112","events":{"414841":"F","414849":"A","414853":"S","414854":"C","414866":"R"}}]},{"str":"ffffffff800234ec addiu $a0, $a0, 1",uops:[{"uuid":"105113","events":{"414842":"F","414850":"A","414854":"S","414855":"C","414867":"R"}}]},{"str":"ffffffff800234f0 bne $a3, $a0, 0x800234ac",uops:[{"uuid":"105114","events":{"414843":"F","414850":"A","414855":"S","414856":"C","414867":"R"}}]},{"str":"ffffffff800234f4 addiu $a1, $a1, 8",uops:[{"uuid":"105115","events":{"414844":"F","414851":"A","414856":"S","414857":"C","414868":"R"}}]},{"str":"ffffffff800234ac lwc1 $f5, -4($a1)",uops:[{"uuid":"105116","events":{"414845":"F","414851":"A","414852":"Q","414856":"S","414858":"M","414858":"E","414859":"G","414859":"B","414860":"N","414862":"P","414862":"L","414863":"C","414868":"R"}}]},{"str":"ffffffff800234b0 c.lt.s $f0, $f5",uops:[{"uuid":"105117","events":{"414846":"F","414854":"A","414870":"C","414871":"R"}}]},{"str":"ffffffff800234b4 nop ",uops:[{"uuid":"105118","events":{"414846":"F","414854":"A","414854":"C","414871":"R"}}]},{"str":"ffffffff800234b8 bc1fl 0x800234d0",uops:[{"uuid":"105119","events":{"414847":"F","414855":"A","414870":"S","414871":"C","414872":"R"}}]},{"str":"ffffffff800234bc lwc1 $f5, ($a1)",uops:[{"uuid":"105120","events":{"414848":"F","414855":"A","414856":"Q","414857":"S","414860":"M","414861":"B","414863":"O","414864":"P","414865":"C","414872":"R"}}]},{"str":"ffffffff800234d0 c.lt.s $f0, $f5",uops:[{"uuid":"105121","events":{"414851":"F","414860":"A","414876":"C","414877":"R"}}]},{"str":"ffffffff800234d4 nop ",uops:[{"uuid":"105122","events":{"414851":"F","414860":"A","414860":"C","414877":"R"}}]},{"str":"ffffffff800234d8 bc1f 0x800234ec",uops:[{"uuid":"105123","events":{"414852":"F","414861":"A","414876":"S","414877":"C","414878":"R"}}]},{"str":"ffffffff800234dc addiu $a0, $a0, 1",uops:[{"uuid":"105124","events":{"414853":"F","414861":"A","414865":"S","414866":"C","414878":"R"}}]},{"str":"ffffffff800234ec addiu $a0, $a0, 1",uops:[{"uuid":"105125","events":{"414854":"F","414862":"A","414866":"S","414867":"C","414879":"R"}}]},{"str":"ffffffff800234f0 bne $a3, $a0, 0x800234ac",uops:[{"uuid":"105126","events":{"414855":"F","414862":"A","414867":"S","414868":"C","414879":"R"}}]},{"str":"ffffffff800234f4 addiu $a1, $a1, 8",uops:[{"uuid":"105127","events":{"414856":"F","414863":"A","414868":"S","414869":"C","414880":"R"}}]},{"str":"ffffffff800234ac lwc1 $f5, -4($a1)",uops:[{"uuid":"105128","events":{"414857":"F","414863":"A","414864":"Q","414868":"S","414870":"H","414871":"C","414880":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
