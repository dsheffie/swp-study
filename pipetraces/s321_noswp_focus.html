<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff80023ed8 lwc1 $f2, -4($a0)",uops:[{"uuid":"38474","events":{"113316":"F","113321":"A","113323":"Q","113324":"S","113326":"H","113327":"C","113351":"R"}}]},{"str":"ffffffff80023edc mul.s $f2, $f0, $f2",uops:[{"uuid":"38475","events":{"113316":"F","113322":"A","113354":"C","113355":"R"}}]},{"str":"ffffffff80023ee0 lwc1 $f1, -4($a2)",uops:[{"uuid":"38476","events":{"113317":"F","113323":"A","113324":"Q","113325":"S","113327":"H","113328":"C","113355":"R"}}]},{"str":"ffffffff80023ee4 add.s $f1, $f1, $f2",uops:[{"uuid":"38477","events":{"113318":"F","113324":"A","113360":"C","113361":"R"}}]},{"str":"ffffffff80023ee8 lwc1 $f2, ($a0)",uops:[{"uuid":"38478","events":{"113319":"F","113325":"A","113326":"Q","113327":"S","113329":"H","113330":"C","113361":"R"}}]},{"str":"ffffffff80023eec mul.s $f2, $f1, $f2",uops:[{"uuid":"38479","events":{"113320":"F","113326":"A","113366":"C","113367":"R"}}]},{"str":"ffffffff80023ef0 lwc1 $f0, ($a2)",uops:[{"uuid":"38480","events":{"113321":"F","113327":"A","113328":"Q","113329":"S","113331":"H","113332":"C","113367":"R"}}]},{"str":"ffffffff80023ef4 addiu $a0, $a0, 8",uops:[{"uuid":"38481","events":{"113321":"F","113327":"A","113330":"S","113331":"C","113368":"R"}}]},{"str":"ffffffff80023ef8 add.s $f0, $f0, $f2",uops:[{"uuid":"38482","events":{"113322":"F","113328":"A","113372":"C","113373":"R"}}]},{"str":"ffffffff80023efc addiu $a2, $a2, 8",uops:[{"uuid":"38483","events":{"113322":"F","113328":"A","113331":"S","113332":"C","113373":"R"}}]},{"str":"ffffffff80023f00 swc1 $f1, -0xc($a2)",uops:[{"uuid":"38484","events":{"113323":"F","113329":"A","113330":"Q","113331":"S","113361":"Z","113334":"C","113374":"R"}}]},{"str":"ffffffff80023f04 bne $a2, $a1, 0x80023ed8",uops:[{"uuid":"38485","events":{"113323":"F","113330":"A","113333":"S","113334":"C","113374":"R"}}]},{"str":"ffffffff80023f08 swc1 $f0, -8($a2)",uops:[{"uuid":"38486","events":{"113324":"F","113331":"A","113332":"Q","113333":"S","113373":"Z","113336":"C","113375":"R"}}]},{"str":"ffffffff80023ed8 lwc1 $f2, -4($a0)",uops:[{"uuid":"38487","events":{"113325":"F","113331":"A","113333":"Q","113334":"S","113336":"H","113337":"C","113375":"R"}}]},{"str":"ffffffff80023edc mul.s $f2, $f0, $f2",uops:[{"uuid":"38488","events":{"113325":"F","113332":"A","113378":"C","113379":"R"}}]},{"str":"ffffffff80023ee0 lwc1 $f1, -4($a2)",uops:[{"uuid":"38489","events":{"113326":"F","113333":"A","113334":"Q","113335":"S","113337":"H","113338":"C","113379":"R"}}]},{"str":"ffffffff80023ee4 add.s $f1, $f1, $f2",uops:[{"uuid":"38490","events":{"113327":"F","113334":"A","113384":"C","113385":"R"}}]},{"str":"ffffffff80023ee8 lwc1 $f2, ($a0)",uops:[{"uuid":"38491","events":{"113328":"F","113337":"A","113338":"Q","113339":"S","113341":"H","113342":"C","113385":"R"}}]},{"str":"ffffffff80023eec mul.s $f2, $f1, $f2",uops:[{"uuid":"38492","events":{"113329":"F","113338":"A","113390":"C","113391":"R"}}]},{"str":"ffffffff80023ef0 lwc1 $f0, ($a2)",uops:[{"uuid":"38493","events":{"113330":"F","113343":"A","113344":"Q","113345":"S","113347":"H","113348":"C","113391":"R"}}]},{"str":"ffffffff80023ef4 addiu $a0, $a0, 8",uops:[{"uuid":"38494","events":{"113330":"F","113344":"A","113347":"S","113348":"C","113392":"R"}}]},{"str":"ffffffff80023ef8 add.s $f0, $f0, $f2",uops:[{"uuid":"38495","events":{"113331":"F","113345":"A","113396":"C","113397":"R"}}]},{"str":"ffffffff80023efc addiu $a2, $a2, 8",uops:[{"uuid":"38496","events":{"113331":"F","113349":"A","113352":"S","113353":"C","113397":"R"}}]},{"str":"ffffffff80023f00 swc1 $f1, -0xc($a2)",uops:[{"uuid":"38497","events":{"113332":"F","113350":"A","113351":"Q","113352":"S","113385":"Z","113355":"C","113398":"R"}}]},{"str":"ffffffff80023f04 bne $a2, $a1, 0x80023ed8",uops:[{"uuid":"38498","events":{"113333":"F","113351":"A","113354":"S","113355":"C","113398":"R"}}]},{"str":"ffffffff80023f08 swc1 $f0, -8($a2)",uops:[{"uuid":"38499","events":{"113334":"F","113352":"A","113353":"Q","113354":"S","113397":"Z","113357":"C","113399":"R"}}]},{"str":"ffffffff80023ed8 lwc1 $f2, -4($a0)",uops:[{"uuid":"38500","events":{"113335":"F","113353":"A","113354":"Q","113355":"S","113357":"H","113358":"C","113399":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
