<!doctype html>
<html><head><meta charset="utf-8"><title>r9999 pipeline trace</title>
<style>
 :root{--bg:#12141a;--fg:#e6e8ee;--dim:#8b93a7;--grid:#232734;
       --F:#4c8dff;--A:#c678dd;--C:#e5c07b;--R:#57c98a;--M:#7f8aa3;--accent:#57c98a}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--fg);
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
 header{padding:14px 18px;border-bottom:1px solid var(--grid);
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 h1{font-size:15px;margin:0;letter-spacing:.02em}
 .legend{color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
 .k{display:inline-flex;gap:5px;align-items:center}
 .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
 #wrap{overflow:auto;max-height:calc(100vh - 62px)}
 table{border-collapse:collapse;white-space:nowrap}
 th{position:sticky;top:0;background:var(--bg);color:var(--dim);
    font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--grid)}
 td{padding:0 2px;height:19px}
 td.insn{position:sticky;left:0;background:var(--bg);padding-right:14px;
         border-right:1px solid var(--grid);color:var(--fg)}
 td.insn .pc{color:var(--dim);margin-right:8px}
 .cell{display:block;width:13px;text-align:center;border-radius:2px;
       font-size:11px;font-weight:600;color:#12141a;background:var(--M)}
 .Fc{background:var(--F)} .Ac{background:var(--A)}
 .Cc{background:var(--C)} .Rc{background:var(--R)}
 .span{background:var(--grid);display:block;height:3px;margin-top:8px}
</style></head><body>
<header>
  <h1>r9999 &mdash; pipeline trace</h1>
  <div class="legend">
    <span class="k"><i class="sw" style="background:var(--F)"></i>Fetch</span>
    <span class="k"><i class="sw" style="background:var(--A)"></i>Alloc</span>
    <span class="k"><i class="sw" style="background:var(--C)"></i>Complete</span>
    <span class="k"><i class="sw" style="background:var(--R)"></i>Retire</span>
    <span class="k"><i class="sw" style="background:var(--M)"></i>Memory pipe (Q LSU entry, S issue, H hit, Z store data, K wake, ...)</span>
    <span id="stats"></span>
  </div>
</header>
<div id="wrap"></div>
<script>
var tableData = [{"str":"ffffffff80034aa0 lwc1 $f2, -4($a2)",uops:[{"uuid":"68316","events":{"106668":"F","106671":"A","106672":"Q","106673":"S","106675":"H","106676":"C","106687":"R"}}]},{"str":"ffffffff80034aa4 mul.s $f1, $f2, $f3",uops:[{"uuid":"68317","events":{"106668":"F","106672":"A","106683":"C","106687":"R"}}]},{"str":"ffffffff80034aa8 lwc1 $f0, -4($a3)",uops:[{"uuid":"68318","events":{"106669":"F","106673":"A","106674":"Q","106675":"S","106677":"H","106678":"C","106688":"R"}}]},{"str":"ffffffff80034aac c.lt.s $f2, $f3",uops:[{"uuid":"68319","events":{"106669":"F","106674":"A","106684":"C","106689":"R"}}]},{"str":"ffffffff80034ab0 add.s $f0, $f0, $f1",uops:[{"uuid":"68320","events":{"106670":"F","106674":"A","106689":"C","106690":"R"}}]},{"str":"ffffffff80034ab4 bc1t 0x80034ba4",uops:[{"uuid":"68321","events":{"106670":"F","106675":"A","106684":"S","106685":"C","106690":"R"}}]},{"str":"ffffffff80034ab8 swc1 $f0, -4($a3)",uops:[{"uuid":"68322","events":{"106671":"F","106675":"A","106676":"Q","106677":"S","106690":"Z","106680":"C","106691":"R"}}]},{"str":"ffffffff80034abc addiu $a1, $a1, 4",uops:[{"uuid":"68323","events":{"106671":"F","106676":"A","106679":"S","106680":"C","106691":"R"}}]},{"str":"ffffffff80034ac0 addiu $a2, $a2, 4",uops:[{"uuid":"68324","events":{"106672":"F","106676":"A","106680":"S","106681":"C","106692":"R"}}]},{"str":"ffffffff80034ac4 addiu $a3, $a3, 4",uops:[{"uuid":"68325","events":{"106672":"F","106677":"A","106681":"S","106682":"C","106692":"R"}}]},{"str":"ffffffff80034ac8 bnel $a3, $t0, 0x80034aa0",uops:[{"uuid":"68326","events":{"106673":"F","106677":"A","106682":"S","106683":"C","106693":"R"}}]},{"str":"ffffffff80034acc lwc1 $f3, -4($a1)",uops:[{"uuid":"68327","events":{"106674":"F","106678":"A","106679":"Q","106680":"S","106682":"H","106683":"C","106693":"R"}}]},{"str":"ffffffff80034aa0 lwc1 $f2, -4($a2)",uops:[{"uuid":"68328","events":{"106675":"F","106679":"A","106680":"Q","106681":"S","106683":"H","106684":"C","106694":"R"}}]},{"str":"ffffffff80034aa4 mul.s $f1, $f2, $f3",uops:[{"uuid":"68329","events":{"106675":"F","106680":"A","106691":"C","106694":"R"}}]},{"str":"ffffffff80034aa8 lwc1 $f0, -4($a3)",uops:[{"uuid":"68330","events":{"106676":"F","106681":"A","106682":"Q","106683":"S","106685":"H","106686":"C","106695":"R"}}]},{"str":"ffffffff80034aac c.lt.s $f2, $f3",uops:[{"uuid":"68331","events":{"106676":"F","106682":"A","106692":"C","106696":"R"}}]},{"str":"ffffffff80034ab0 add.s $f0, $f0, $f1",uops:[{"uuid":"68332","events":{"106677":"F","106682":"A","106697":"C","106698":"R"}}]},{"str":"ffffffff80034ab4 bc1t 0x80034ba4",uops:[{"uuid":"68333","events":{"106677":"F","106683":"A","106692":"S","106693":"C","106698":"R"}}]},{"str":"ffffffff80034ab8 swc1 $f0, -4($a3)",uops:[{"uuid":"68334","events":{"106678":"F","106683":"A","106684":"Q","106685":"S","106698":"Z","106688":"C","106699":"R"}}]},{"str":"ffffffff80034abc addiu $a1, $a1, 4",uops:[{"uuid":"68335","events":{"106678":"F","106684":"A","106687":"S","106688":"C","106699":"R"}}]},{"str":"ffffffff80034ac0 addiu $a2, $a2, 4",uops:[{"uuid":"68336","events":{"106679":"F","106684":"A","106688":"S","106689":"C","106700":"R"}}]},{"str":"ffffffff80034ac4 addiu $a3, $a3, 4",uops:[{"uuid":"68337","events":{"106679":"F","106685":"A","106689":"S","106690":"C","106700":"R"}}]},{"str":"ffffffff80034ac8 bnel $a3, $t0, 0x80034aa0",uops:[{"uuid":"68338","events":{"106680":"F","106685":"A","106690":"S","106691":"C","106701":"R"}}]},{"str":"ffffffff80034acc lwc1 $f3, -4($a1)",uops:[{"uuid":"68339","events":{"106681":"F","106686":"A","106687":"Q","106688":"S","106690":"H","106691":"C","106701":"R"}}]},{"str":"ffffffff80034aa0 lwc1 $f2, -4($a2)",uops:[{"uuid":"68340","events":{"106682":"F","106687":"A","106688":"Q","106689":"S","106691":"H","106692":"C","106702":"R"}}]}]
;(function(){
  var rows=[],minC=Infinity,maxC=-Infinity;
  tableData.forEach(function(rec){
    var u=rec.uops[0], ev=u.events, o={str:rec.str,uuid:u.uuid,ev:{}};
    for(var c in ev){var n=+c; o.ev[n]=ev[c]; if(n<minC)minC=n; if(n>maxC)maxC=n;}
    rows.push(o);
  });
  if(!rows.length){document.getElementById('wrap').textContent='no records';return;}
  var span=maxC-minC+1;
  if(span>4000){maxC=minC+4000;span=4001;}   /* keep the DOM sane */
  document.getElementById('stats').textContent=
     rows.length+' insns · cycles '+minC+'–'+maxC+' ('+span+')';
  var h='<table><thead><tr><th>instruction</th>';
  for(var c=minC;c<=maxC;c++) h+='<th>'+((c-minC)%10===0?(c-minC):'')+'</th>';
  h+='</tr></thead><tbody>';
  rows.forEach(function(r){
    var parts=r.str.split(' '), pc=parts.shift();
    h+='<tr><td class="insn"><span class="pc">'+pc.slice(-8)+'</span>'+parts.join(' ')+'</td>';
    var f=null,l=null;
    for(var c in r.ev){var n=+c; if(f===null||n<f)f=n; if(l===null||n>l)l=n;}
    for(var c=minC;c<=maxC;c++){
      var e=r.ev[c];
      if(e) h+='<td><span class="cell '+e+'c">'+e+'</span></td>';
      else if(c>f&&c<l) h+='<td><span class="span"></span></td>';
      else h+='<td></td>';
    }
    h+='</tr>';
  });
  document.getElementById('wrap').innerHTML=h+'</tbody></table>';
})();
</script></body></html>
